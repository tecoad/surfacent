name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    # Off until the first version is on npm and its Trusted Publisher points at
    # this workflow: then set the repository variable RELEASE_ENABLED to true.
    if: vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs a recent npm.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # Picks the version from the commits since the last tag, builds the package
      # (prepack) and publishes it, then tags and writes the GitHub release.
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
